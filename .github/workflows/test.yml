name: Gateway tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gateway-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows / Node 24
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agent-gateway
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 11.25.0
          package_json_file: agent-gateway/package.json
          run_install: false
          cache: true
          cache_dependency_path: agent-gateway/pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --node-linker=hoisted
      - name: Run gateway tests
        run: pnpm test
